const roles=['Designer','Developer','Strategist','Manager','Member'];
const stages=['Lead','Qualified','Proposal','Won','Lost'];
const nav=[['dashboard','grid','Dashboard'],['projects','folder','Projects & tasks'],['crm','users','CRM'],['team','users','Team'],['summary','spark','Workspace summary'],['finance','wallet','Finance'],['calendar','calendar','Calendar'],['documents','file','Documents'],['workflows','flow','Workflows'],['reports','chart','Reports'],['goals','target','Goals'],['settings','settings','Settings']];
const label=p=>nav.find(x=>x[0]===p)?.[2]||({tasks:'Tasks',notifications:'Notifications',search:'Search results'})[p]||p;
const button=(text,action,ic='',cls='')=>`<button class="btn ${cls}" data-action="${action}">${ic?icon(ic):''}${text}</button>`;
const ib=(ic,action,title,attrs='')=>`<button class="iconbtn" data-action="${action}" aria-label="${esc(title)}" title="${esc(title)}" ${attrs}>${icon(ic)}</button>`;
const go=(p,text)=>`<button class="textlink" data-page="${p}">${text}${icon('arrow')}</button>`;
let toastTimer;function toast(text){const el=document.querySelector('#toast');el.textContent=text;el.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>el.classList.remove('show'),5500);}
function commit(fn,description){if(storageOK&&localStorage.getItem(key)!==lastStored){toast('Another tab changed your data. Reload before editing to avoid overwriting it.');return;}const next=structuredClone(state);fn(next);if(description){next.spaces[next.mode].activity.unshift({id:uid(),title:description,at:new Date().toISOString()});next.spaces[next.mode].activity=next.spaces[next.mode].activity.slice(0,100);}if(storageOK){try{localStorage.setItem(key,JSON.stringify(next));lastStored=JSON.stringify(next);}catch{storageOK=false;storageNotice='Storage is full or blocked. Changes are temporary. Export your data to keep a backup.';toast(storageNotice);}}state=next;render();}
function metrics(){const s=sp(),open=s.tasks.filter(x=>!x.done),overdue=open.filter(x=>x.due&&x.due<localDate()),pipeline=s.deals.filter(x=>!['Won','Lost'].includes(x.stage)).reduce((n,x)=>n+Number(x.amount),0);return {open,overdue,pipeline,completed:s.tasks.filter(x=>x.done).length,progress:s.tasks.length?Math.round(s.tasks.filter(x=>x.done).length/s.tasks.length*100):0};}
function apply(){const p=state.settings;document.body.dataset.theme=['midnight','mint','purple','white','black'].includes(p.theme)?p.theme:'midnight';document.documentElement.style.setProperty('--accent',/^#[0-9a-f]{6}$/i.test(p.accent)?p.accent:'#5a8dff');document.body.classList.toggle('compact',p.compact);}
function render(){apply();const s=sp(),isBusiness=state.mode==='business',m=metrics();app.innerHTML=`<div class="app"><aside class="sidebar"><div class="sidebar-top"><div><div class="brand">${icon('link')}<div>Life<span>Pal</span></div></div><div class="brand-caption">YOUR EVERYDAY OS</div></div><div class="switch"><button data-mode="personal" class="${!isBusiness?'active':''}">${icon('user')}Personal</button><button data-mode="business" class="${isBusiness?'active':''}">${icon('briefcase')}Business</button></div><div class="space row"><span class="avatar">${isBusiness?'B':'P'}</span><div style="min-width:0;flex:1"><div style="font-size:10px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(s.name)}</div><small>Local workspace</small></div>${icon('chevron')}</div></div><div class="nav-label">WORKSPACE</div><nav class="nav">${nav.filter(([p])=>isBusiness||!['crm','team'].includes(p)).map(([p,ic,title],i)=>`${i===5?'<div class="nav-sep"></div>':''}<button data-page="${p}" class="${page===p?'active':''}">${icon(ic)}${title}</button>`).join('')}</nav><div class="sidebar-bottom"><div class="local-note"><div class="row" style="margin-bottom:5px;color:var(--accent)">${icon('lock')}<b>No account needed</b></div>${storageOK?'Saved on this browser. Export a backup anytime.':'Temporary session. Export to keep your changes.'}</div><div class="user row"><span class="avatar">${esc((state.settings.name||'Y').slice(0,1).toUpperCase())}</span><div style="flex:1"><h3 style="font-size:11px">${esc(state.settings.name)}</h3><small>Local mode</small></div>${ib('settings','settings','Open settings')}</div></div></aside><main><header class="topbar"><div class="breadcrumb">${isBusiness?'Business':'Personal'} workspace <span style="margin:0 10px;color:var(--muted)">/</span><span>${label(page)}</span></div><div class="row"><form class="search" id="search-form">${icon('search')}<input name="q" value="${esc(query)}" placeholder="Search workspace..." aria-label="Search workspace"></form><span class="divider"></span>${ib('sun','appearance','Appearance')}${ib('bell','notifications','Notifications')}<span class="avatar" style="border-radius:50%;width:27px;height:27px;font-size:9px">LP</span></div></header><div class="content"><div class="row between page-head"><div><div class="eyebrow">${isBusiness?'BUSINESS OVERVIEW':'YOUR PERSONAL SPACE'}</div><h1>${page==='dashboard'?esc(s.name):label(page)}</h1><div class="subtitle">${page==='dashboard'?'Everything in focus. A clear view of what’s next.':subtitles[page]||'Keep the important things in one thoughtful space.'}</div></div><div class="actions row">${page==='dashboard'?`${button('Summarize workspace','summary','spark','secondary')}${button('New task','new-task','plus')}`:newButton()}</div></div>${storageNotice?`<div class="notice">${esc(storageNotice)}</div>`:''}<div class="row between" style="margin-bottom:20px"><div class="row"><span class="pill blue"><span class="dot"></span>LOCAL MODE</span><small>Sample content is editable · No cloud connection</small></div><small class="top-date">${new Date().toLocaleDateString('en-US',{weekday:'short',month:'short',day:'numeric'})}</small></div>${body()}</div></main></div>`;}
const subtitles={projects:'From the first idea to the final detail.',tasks:'A clear plan for your next step.',crm:'Good relationships. Meaningful opportunities.',team:'Your people, organized in one place.',finance:'A clearer picture of your manual financial records.',calendar:'Make time for what matters.',documents:'A home for ideas, briefs, and working notes.',workflows:'Repeatable checklists for a smoother day.',reports:'A little perspective on your progress.',goals:'Small steps. Bigger possibilities.',settings:'Make this space feel like yours.',summary:'A quick, calculated snapshot of your workspace.',notifications:'Upcoming and overdue items, all in one place.'};
function newButton(){const type={projects:'project',tasks:'task',crm:'deal',team:'person',finance:'transaction',calendar:'event',documents:'note',workflows:'workflow',goals:'goal'}[page];return type?button('New '+(type==='person'?'contact':type),'new-'+type,'plus'):button('Export data','export','download','secondary');}
const empty=(text='A fresh start. Add your first item to get going.')=>`<div class="empty">${text}</div>`;
function statsCards(){const m=metrics(),s=sp();const data=[[s.projects.length,'ACTIVE PROJECTS','folder',`${s.projects.length} projects in this workspace`],[m.open.length,'OPEN TASKS','check',`${m.completed} completed`],[m.overdue.length,'OVERDUE TASKS','alert',m.overdue.length?'Needs your attention':'Everything is on track'],[state.mode==='business'?money(m.pipeline):s.goals.length,state.mode==='business'?'OPEN PIPELINE':'PERSONAL GOALS',state.mode==='business'?'dollar':'target',state.mode==='business'?`${s.deals.filter(x=>!['Won','Lost'].includes(x.stage)).length} open opportunities`:'Keep the bigger picture']];return `<div class="grid stats">${data.map(([v,k,ic,foot])=>`<section class="panel stat"><div class="row between"><span class="stat-label">${k}</span><span class="stat-icon">${icon(ic)}</span></div><div class="stat-value">${v}</div><div class="stat-foot">${foot}</div></section>`).join('')}</div>`;}
function projectsList(){return sp().projects.map((p,i)=>{const tasks=sp().tasks.filter(x=>x.project===p.id),done=tasks.filter(x=>x.done).length,percent=tasks.length?Math.round(done/tasks.length*100):0;return `<div class="project-row"><div class="row between"><div class="row"><span class="project-icon" style="color:${safeColor(p.color)}">${icon('folder')}</span><div><div class="project-title">${esc(p.title)}</div><div class="project-meta">${esc(p.client||'Personal project')}</div></div></div><div class="row"><small>${done}/${tasks.length} tasks</small>${page==='projects'?ib('edit','edit','Edit project',`data-kind="projects" data-id="${esc(p.id)}"`):`<span class="pill ${percent===100?'green':'blue'}">${percent}%</span>`}</div></div><div class="progress"><div style="width:${percent}%;background:${safeColor(p.color)}"></div></div></div>`;}).join('')||empty();}
function safeColor(c){return /^#[0-9a-f]{6}$/i.test(c)?c:'#5a8dff';}
function taskList(list){return list.map(x=>{const project=sp().projects.find(p=>p.id===x.project);return `<div class="task-row ${x.done?'done':''}"><button class="check ${x.done?'yes':''}" data-action="toggle" data-id="${esc(x.id)}" data-kind="tasks" aria-label="${x.done?'Reopen':'Complete'} ${esc(x.title)}">${x.done?icon('check'):''}</button><div class="body"><div class="task-title">${esc(x.title)}</div><div class="project-meta">${esc(project?.title||'General')} <span style="margin:0 6px">·</span><span style="color:${!x.done&&x.due&&x.due<localDate()?'#f48194':'var(--muted)'}">${niceDate(x.due)}</span></div></div><span class="pill ${x.priority==='High'?'red':x.priority==='Medium'?'blue':''}">${esc(x.priority)}</span>${ib('edit','edit','Edit task',`data-kind="tasks" data-id="${esc(x.id)}"`)}</div>`;}).join('')||empty('Nothing waiting here. A little room to breathe.');}
function pipeline(){const totals=stages.map(stage=>sp().deals.filter(x=>x.stage===stage).reduce((n,x)=>n+Number(x.amount),0));const max=Math.max(1,...totals);return `<div class="chart"><div class="bars">${totals.map((v,i)=>`<div class="bar-wrap"><small>${money(v)}</small><div class="bar" style="height:${v?Math.max(5,v/max*80):1}%;${i===2?'background:linear-gradient(180deg,#efbd66,#c78a32)':i===3?'background:linear-gradient(180deg,#6ce1ba,#2b9478)':''}"></div></div>`).join('')}</div><div class="bar-labels">${stages.map(x=>`<span>${x}</span>`).join('')}</div></div>`;}
function activityList(){return sp().activity.slice(0,5).map(x=>`<div class="task-row"><span class="project-icon">${icon('activity')}</span><div class="body"><div class="task-title">${esc(x.title)}</div><div class="project-meta">${new Date(x.at).toLocaleString('en-US',{month:'short',day:'numeric',hour:'2-digit',minute:'2-digit'})}</div></div></div>`).join('')||empty('Your recent changes will appear here.');}
function dashboard(){const widgets=state.settings.widgets||[],m=metrics();return `${statsCards()}<div class="grid two">${widgets.includes('projects')?`<section class="panel"><div class="panel-head"><h2>Project progress</h2>${go('projects','All projects')}</div>${projectsList()}</section>`:''}${widgets.includes('risk')?`<section class="panel"><div class="panel-head"><h2>Overdue & at risk</h2><span class="pill red">${m.overdue.length} overdue</span></div>${taskList(m.overdue.slice(0,3))}${m.overdue.length?`<div class="pad" style="padding-top:10px"><small>A small nudge today makes room for tomorrow.</small></div>`:''}</section>`:''}</div>${widgets.includes('pipeline')&&state.mode==='business'?`<section class="panel bottom-grid"><div class="panel-head"><div><h2>Sales pipeline</h2><div class="project-meta">Opportunity value by stage · manual records</div></div><div class="row"><span class="chart-legend"><span><span class="dot"></span>USD</span></span>${go('crm','Open CRM')}</div></div>${pipeline()}</section>`:''}<div class="grid two bottom-grid"><section class="panel"><div class="panel-head"><h2>Coming up next</h2>${go('calendar','View calendar')}</div>${sp().events.filter(x=>x.due>=localDate()).sort((a,b)=>a.due.localeCompare(b.due)).slice(0,3).map(x=>`<div class="task-row"><span class="project-icon">${icon('calendar')}</span><div class="body"><div class="task-title">${esc(x.title)}</div><div class="project-meta">${niceDate(x.due)} · ${esc(x.time||'All day')}</div></div><span class="pill blue">Upcoming</span></div>`).join('')||empty('No upcoming events.')}</section>${widgets.includes('activity')?`<section class="panel"><div class="panel-head"><h2>Recent activity</h2><span class="pill">This browser</span></div>${activityList()}</section>`:''}</div><div class="row wrap" style="margin-top:20px"><small>PINNED</small>${(state.settings.pins||[]).map(p=>`<button class="btn ghost" data-page="${esc(p)}">${icon('up')}${label(p)}</button>`).join('')}</div>`;}
function body(){if(page==='dashboard')return dashboard();if(page==='projects'||page==='tasks')return `${page==='projects'?`<section class="panel" style="margin-bottom:20px"><div class="panel-head"><h2>Projects</h2><span class="pill">${sp().projects.length} total</span></div>${projectsList()}</section>`:''}<div class="row between"><div class="toolbar">${['All','Open','Completed','Overdue'].map(f=>`<button data-filter="${f}" class="${filter===f?'active':''}">${f}</button>`).join('')}</div>${button('Add task','new-task','plus','secondary')}</div><section class="panel">${taskList(sp().tasks.filter(x=>filter==='All'||filter==='Open'&&!x.done||filter==='Completed'&&x.done||filter==='Overdue'&&!x.done&&x.due&&x.due<localDate()))}</section>`;
 if(page==='crm')return `<section class="panel"><div class="panel-head"><h2>Opportunities</h2><span class="pill green">${money(metrics().pipeline)} open</span></div><div class="table-wrap"><table><thead><tr><th>OPPORTUNITY</th><th>COMPANY</th><th>VALUE</th><th>STAGE</th><th></th></tr></thead><tbody>${sp().deals.map(x=>`<tr><td>${esc(x.title)}</td><td class="muted">${esc(x.company)}</td><td>${money(x.amount)}</td><td><span class="pill ${x.stage==='Won'?'green':x.stage==='Proposal'?'yellow':'blue'}">${esc(x.stage)}</span></td><td>${ib('edit','edit','Edit opportunity',`data-kind="deals" data-id="${esc(x.id)}"`)}</td></tr>`).join('')}</tbody></table></div>${sp().deals.length?'':empty()}</section>`;
 if(page==='team')return `<div class="notice">Local contact directory only. Adding a person does not send an invitation, create an account, or grant access.</div><div class="grid three">${sp().people.map(x=>`<section class="panel person"><span class="avatar">${esc(x.title.split(' ').map(x=>x[0]).slice(0,2).join(''))}</span><div style="flex:1;min-width:0"><h3>${esc(x.title)}</h3><small>${esc(x.role)}</small><p style="font-size:10px;overflow-wrap:anywhere;color:var(--muted);margin-top:6px">${esc(x.email)}</p></div>${ib('edit','edit','Edit contact',`data-kind="people" data-id="${esc(x.id)}"`)}</section>`).join('')||empty()}</div>`;
 if(page==='finance')return finance();if(page==='calendar')return calendar();if(page==='settings')return settings();
 if(page==='documents')return `<div class="grid three">${sp().notes.map(x=>`<section class="panel note"><div class="row between"><span class="project-icon">${icon('file')}</span>${ib('edit','edit','Edit note',`data-kind="notes" data-id="${esc(x.id)}"`)}</div><h2>${esc(x.title)}</h2><p>${esc(x.body)}</p></section>`).join('')||empty()}</div>`;
 if(page==='workflows')return `<div class="notice">Reusable manual checklists. These do not run automations or perform actions in other apps.</div><div class="grid three">${sp().workflows.map(x=>`<section class="panel pad"><div class="row between"><span class="project-icon">${icon('flow')}</span>${ib('edit','edit','Edit checklist',`data-kind="workflows" data-id="${esc(x.id)}"`)}</div><h2 style="margin:18px 0">${esc(x.title)}</h2><ol class="summary-list">${x.body.split('\n').filter(Boolean).map(l=>`<li>${esc(l)}</li>`).join('')}</ol><button class="btn ${x.done?'secondary':''}" data-action="toggle" data-kind="workflows" data-id="${esc(x.id)}">${icon('check')}${x.done?'Completed · Run again':'Mark completed'}</button></section>`).join('')||empty()}</div>`;
 if(page==='goals')return `<div class="grid three">${sp().goals.map(x=>{const pct=Math.min(100,Math.round(x.current/x.target*100));return `<section class="panel pad"><div class="row between"><span class="project-icon">${icon('target')}</span>${ib('edit','edit','Edit goal',`data-kind="goals" data-id="${esc(x.id)}"`)}</div><h2 style="margin-top:20px">${esc(x.title)}</h2><div class="goal-value">${Number(x.current)} <small>/ ${Number(x.target)}</small></div><div class="progress"><div style="width:${pct}%"></div></div><small>${pct}% of the way there</small></section>`;}).join('')||empty()}</div>`;
 if(page==='summary'||page==='reports'){const m=metrics(),income=sp().transactions.filter(x=>x.amount>0).reduce((n,x)=>n+x.amount,0),expense=sp().transactions.filter(x=>x.amount<0).reduce((n,x)=>n-x.amount,0);return `${statsCards()}<div class="grid two"><section class="panel pad"><div class="row" style="color:var(--accent);margin-bottom:18px">${icon('spark')}<h2 style="color:var(--text)">Your workspace, at a glance</h2></div><p class="muted" style="font-size:12px">A calculated summary of the records in this workspace. No AI service or external connection.</p><ul class="summary-list"><li>${m.completed} of ${sp().tasks.length} tasks completed (${m.progress}%).</li><li>${m.overdue.length?`${m.overdue.length} overdue tasks need attention.`:'No overdue tasks. You’re on track.'}</li><li>${sp().projects.length} projects and ${sp().goals.length} goals in progress.</li><li>${money(m.pipeline)} in open sales opportunities.</li><li>Recorded income: ${money(income)}. Expenses: ${money(expense)}.</li></ul></section><section class="panel pad"><h2>Task completion</h2><div class="goal-value" style="font-size:46px">${m.progress}<small>%</small></div><div class="progress" style="height:8px;margin:20px 0"><div style="width:${m.progress}%"></div></div><p class="muted" style="font-size:12px">${m.open.length} open · ${m.completed} completed</p><div style="margin-top:25px">${button('Review your tasks','tasks','arrow','secondary')}</div></section></div>`;}
 if(page==='notifications'){const due=sp().tasks.filter(x=>!x.done&&x.due&&x.due<=localDate(1));return `<div class="notice">Reminders appear while you use this app. Background, email, and push notifications are not connected.</div><section class="panel">${state.settings.reminders?taskList(due):empty('In-app reminders are turned off in Settings.')}</section>`;}
 if(page==='search'){const found=[];for(const kind of ['tasks','projects','deals','people','events','notes','goals','transactions','cards','workflows'])for(const x of sp()[kind])if([x.title,x.body,x.company,x.email].filter(Boolean).join(' ').toLowerCase().includes(query.toLowerCase()))found.push({kind,x});return `<section class="panel"><div class="panel-head"><h2>${found.length} results for “${esc(query)}”</h2><small>Current workspace only</small></div>${found.map(({kind,x})=>`<div class="task-row"><span class="project-icon">${icon('search')}</span><div class="body"><div class="task-title">${esc(x.title)}</div><small>${esc(kind)}</small></div>${ib('edit','edit','Open result',`data-kind="${kind}" data-id="${esc(x.id)}"`)}</div>`).join('')||empty('No matching records.')}</section>`;}return '';}
function finance(){return `<div class="notice">Design previews only. Cards, freezing, and spending limits are simulated. No Visa/Mastercard issuance, bank connection, real balance, or payments. Transactions are manual records in USD.</div><div class="row between" style="margin-bottom:18px"><h2>Virtual card designs</h2>${button('Add card design','new-card','plus','secondary')}</div><div class="grid three" style="margin-bottom:25px">${sp().cards.map(x=>`<div><div class="card ${x.frozen?'frozen':''}" style="--card:${safeColor(x.color)}"><div class="row between"><b>LifePal</b><small style="color:#ffffffaa">DEMO CARD</small></div><div class="card-number">•••• •••• •••• DEMO</div><div class="row between"><span>${esc(x.title)}</span>${icon('card')}</div></div><div class="row between" style="margin-top:10px"><small>${x.frozen?'Frozen · ':''}Demo limit ${money(x.limit)}</small><div class="row">${ib('snow','freeze','Toggle demo freeze',`data-id="${esc(x.id)}"`)}${ib('edit','edit','Edit card design',`data-kind="cards" data-id="${esc(x.id)}"`)}</div></div></div>`).join('')||empty('No card designs yet.')}</div><section class="panel"><div class="panel-head"><h2>Transaction records</h2><span class="pill">Manual entries</span></div><div class="table-wrap"><table><thead><tr><th>DESCRIPTION</th><th>DATE</th><th>AMOUNT</th><th></th></tr></thead><tbody>${sp().transactions.map(x=>`<tr><td>${esc(x.title)}</td><td class="muted">${niceDate(x.due)}</td><td style="color:${x.amount<0?'var(--text)':'var(--green)'}">${money(x.amount)}</td><td>${ib('edit','edit','Edit transaction',`data-kind="transactions" data-id="${esc(x.id)}"`)}</td></tr>`).join('')}</tbody></table></div>${sp().transactions.length?'':empty()}</section>`;}
function calendar(){const first=new Date(year,month,1).getDay(),count=new Date(year,month+1,0).getDate(),title=new Date(year,month).toLocaleDateString('en-US',{month:'long',year:'numeric'});return `<section class="panel"><div class="panel-head"><h2>${title}</h2><div class="row">${ib('chevronLeft','prev-month','Previous month')}${button('Today','today','','ghost')}${ib('chevron','next-month','Next month')}</div></div><div class="calendar">${['Sun','Mon','Tue','Wed','Thu','Fri','Sat'].map(x=>`<div class="day-label">${x}</div>`).join('')}${'<div class="day"></div>'.repeat(first)}${Array.from({length:count},(_,i)=>{const ds=`${year}-${String(month+1).padStart(2,'0')}-${String(i+1).padStart(2,'0')}`;return `<div class="day ${ds===localDate()?'today':''}"><span>${i+1}</span>${sp().events.filter(e=>e.due===ds).map(x=>`<button class="day-event" style="width:100%;text-align:left" data-action="edit" data-kind="events" data-id="${esc(x.id)}" title="${esc(x.title)}">${esc(x.title)}</button>`).join('')}</div>`;}).join('')}</div></section><section class="panel" style="margin-top:20px"><div class="panel-head"><h2>All events</h2></div>${sp().events.slice().sort((a,b)=>a.due.localeCompare(b.due)).map(x=>`<div class="task-row"><span class="project-icon">${icon('calendar')}</span><div class="body"><div class="task-title">${esc(x.title)}</div><div class="project-meta">${niceDate(x.due)} · ${esc(x.time||'All day')}</div></div>${ib('edit','edit','Edit event',`data-kind="events" data-id="${esc(x.id)}"`)}</div>`).join('')||empty()}</section>`;}
function settings(){const p=state.settings;return `<div class="grid settings-grid"><section class="panel pad"><h2>Workspace details</h2><form id="details-form"><label>Your display name<input name="name" value="${esc(p.name)}" required maxlength="80"></label><label>Current workspace name<input name="workspace" value="${esc(sp().name)}" required maxlength="80"></label><button class="btn">Save changes</button></form></section><section class="panel pad"><h2>Appearance</h2><div class="row wrap" style="margin:22px 0">${[['midnight','Midnight Blue','#16233a'],['mint','Arctic Mint','#c1e4d3'],['purple','Royal Purple','#68478f'],['white','Minimal White','#f5f6fa'],['black','Pure Black','#050505']].map(([v,n,c])=>`<button class="theme ${p.theme===v?'selected':''}" data-action="theme" data-value="${v}" aria-label="${n}" title="${n}" style="background:${c}"></button>`).join('')}</div><form id="appearance-form"><label>Accent color<input type="color" name="accent" value="${safeColor(p.accent)}"></label><label class="row"><input type="checkbox" name="compact" ${p.compact?'checked':''}>Compact layout</label><button class="btn">Save appearance</button></form></section><section class="panel pad"><h2>Dashboard preferences</h2><form id="widgets-form"><label>Visible sections</label>${['projects','risk','pipeline','activity'].map(k=>`<label class="row"><input type="checkbox" name="widgets" value="${k}" ${(p.widgets||[]).includes(k)?'checked':''}>${{projects:'Project progress',risk:'Overdue tasks',pipeline:'Sales pipeline',activity:'Recent activity'}[k]}</label>`).join('')}<label>Pinned shortcuts</label>${['tasks','calendar','finance','documents','goals'].map(k=>`<label class="row"><input type="checkbox" name="pins" value="${k}" ${(p.pins||[]).includes(k)?'checked':''}>${label(k)}</label>`).join('')}<label class="row"><input type="checkbox" name="reminders" ${p.reminders?'checked':''}>Show in-app reminders</label><button class="btn">Save preferences</button></form></section><section class="panel pad"><h2>Storage & privacy</h2><div class="setting-row"><h3>No login. No cloud sync.</h3><p>Records stay in this browser on this device. Anyone using this browser profile can access them. Personal and Business keep separate records, but this is not an account security boundary.</p></div><div class="setting-row"><h3>Keep a backup</h3><p>Export both workspaces and preferences as JSON. Clearing browser data can remove your saved records. Local file storage behavior depends on your browser.</p><div class="row wrap" style="margin-top:15px">${button('Export backup','export','download','secondary')}${button('Import backup','import','file','secondary')}</div></div><div class="setting-row"><h3>A fresh workspace</h3><p>Remove sample content from the current workspace. Your other workspace and preferences stay intact.</p><div style="margin-top:15px">${button('Clear this workspace','clear','trash','danger')}</div></div></section></div>`;}
const types={task:'tasks',project:'projects',deal:'deals',person:'people',transaction:'transactions',event:'events',note:'notes',workflow:'workflows',goal:'goals',card:'cards'};
function dialog(title,body,onSave,remove){document.querySelector('dialog')?.remove();const el=document.createElement('dialog');el.innerHTML=`<div class="row between"><h2>${title}</h2><button class="iconbtn" data-close type="button" aria-label="Close">${icon('x')}</button></div><form>${body}<div class="dialog-actions">${remove?'<button class="btn danger" type="button" data-delete>Delete</button>':''}<button class="btn secondary" type="button" data-close>Cancel</button><button class="btn" type="submit">Save changes</button></div></form>`;document.body.append(el);el.querySelectorAll('[data-close]').forEach(x=>x.onclick=()=>el.close());if(remove)el.querySelector('[data-delete]').onclick=()=>{el.close();dialog('Delete this item?',`<p class="muted" style="margin-top:20px">This removes the item from this browser. Export a backup first if you need to keep it.</p>`,()=>remove());};el.querySelector('form').onsubmit=ev=>{ev.preventDefault();try{onSave(new FormData(ev.target));el.close();}catch(err){toast(err.message);}};el.addEventListener('close',()=>el.remove());el.showModal();}
const field=(label,name,value='',type='text',extra='')=>`<label>${label}<input name="${name}" type="${type}" value="${esc(value)}" ${extra}></label>`;
const select=(label,name,values,current)=>`<label>${label}<select name="${name}">${values.map(v=>{const [id,text]=Array.isArray(v)?v:[v,v];return `<option value="${esc(id)}" ${current===id?'selected':''}>${esc(text)}</option>`;}).join('')}</select></label>`;
function edit(kind,id){const old=sp()[kind].find(x=>x.id===id),x=old||{},singular=Object.keys(types).find(k=>types[k]===kind);let fields=field('Name','title',x.title||'','text','required maxlength="200"');
 if(kind==='tasks')fields+=select('Project','project',[['','General'],...sp().projects.map(p=>[p.id,p.title])],x.project||'')+field('Due date','due',x.due||'','date')+select('Priority','priority',['Low','Medium','High'],x.priority||'Medium');
 if(kind==='projects')fields+=field('Client / context','client',x.client||'','text','maxlength="120"')+field('Target date','due',x.due||'','date')+field('Project color','color',safeColor(x.color),'color');
 if(kind==='deals')fields+=field('Company','company',x.company||'','text','maxlength="120"')+field('Value (USD)','amount',x.amount||0,'number','required min="0" max="999999999" step="0.01"')+select('Stage','stage',stages,x.stage||'Lead');
 if(kind==='people')fields+=field('Email','email',x.email||'','email','maxlength="254"')+select('Role label (not an access permission)','role',roles,x.role||'Member');
 if(kind==='events')fields+=field('Date','due',x.due||localDate(),'date','required')+field('Time','time',x.time||'','time');
 if(kind==='transactions')fields+=field('Amount in USD (negative for expense)','amount',x.amount||0,'number','required min="-999999999" max="999999999" step="0.01"')+field('Date','due',x.due||localDate(),'date','required');
 if(kind==='notes'||kind==='workflows')fields+=`<label>${kind==='notes'?'Note':'Checklist steps (one per line)'}<textarea name="body" maxlength="20000" required>${esc(x.body||'')}</textarea></label>`;
 if(kind==='goals')fields+=field('Current progress','current',x.current||0,'number','required min="0" max="9999999" step="1"')+field('Target','target',x.target||10,'number','required min="1" max="9999999" step="1"');
 if(kind==='cards')fields+=`<div class="notice">This is a design preview, not a payment card.</div>`+field('Color','color',safeColor(x.color),'color')+field('Demo limit (USD)','limit',x.limit||500,'number','required min="0" max="9999999" step="1"');
 dialog((old?'Edit ':'New ')+singular,fields,f=>{const values=Object.fromEntries(f);values.title=values.title.trim();if(!values.title)throw Error('Please enter a name.');for(const k of ['amount','current','target','limit'])if(k in values)values[k]=Number(values[k]);commit(next=>{const list=next.spaces[next.mode][kind];if(old)Object.assign(list.find(v=>v.id===id),values);else list.push({id:uid(),done:false,frozen:false,...values});},`${old?'Updated':'Created'} ${singular}: ${values.title}`);},old?()=>commit(next=>{const s=next.spaces[next.mode];s[kind]=s[kind].filter(x=>x.id!==id);if(kind==='projects')s.tasks.forEach(x=>{if(x.project===id)x.project='';});},`Deleted ${singular}: ${old.title}`):null);
}
function exportData(){const url=URL.createObjectURL(new Blob([JSON.stringify(state,null,2)],{type:'application/json'}));const a=document.createElement('a');a.href=url;a.download='LifePal-backup-'+localDate()+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);toast('Backup exported. Keep it somewhere safe.');}
function validateBackup(data){if(data?.version!==2||!['business','personal'].includes(data.mode))throw Error('This is not a LifePal V2 backup.');for(const mode of ['business','personal']){const s=data.spaces?.[mode];if(!s||typeof s.name!=='string')throw Error('Invalid workspace.');for(const kind of Object.values(types)){if(!Array.isArray(s[kind])||s[kind].length>10000)throw Error('Invalid or oversized data.');for(const x of s[kind]){if(!x||typeof x.id!=='string'||typeof x.title!=='string'||x.title.length>200)throw Error('Invalid item.');for(const k of ['amount','current','target','limit'])if(k in x&&(!Number.isFinite(x[k])||Math.abs(x[k])>1e10))throw Error('Invalid number.');if(kind==='goals'&&!(x.target>0&&x.current>=0))throw Error('Invalid goal.');if(['notes','workflows'].includes(kind)&&typeof x.body!=='string')throw Error('Invalid note.');if(x.due&&!/^\d{4}-\d{2}-\d{2}$/.test(x.due))throw Error('Invalid date.');if(kind==='deals'&&!stages.includes(x.stage))throw Error('Invalid stage.');} }if(!Array.isArray(s.activity))s.activity=[];}if(typeof data.settings?.name!=='string')throw Error('Invalid preferences.');data.settings.widgets=Array.isArray(data.settings.widgets)?data.settings.widgets.filter(x=>['projects','risk','pipeline','activity'].includes(x)):[];data.settings.pins=Array.isArray(data.settings.pins)?data.settings.pins.filter(x=>['tasks','calendar','finance','documents','goals'].includes(x)):[];return data;}
function importData(){const input=document.createElement('input');input.type='file';input.accept='.json,application/json';input.onchange=async()=>{const file=input.files?.[0];if(!file)return;try{if(file.size>5000000)throw Error('Backup must be smaller than 5 MB.');const next=validateBackup(JSON.parse(await file.text()));dialog('Replace current data?',`<p class="muted" style="margin-top:20px">This backup will replace both workspaces and preferences. Export the current data first if needed.</p>`,()=>{if(!storageOK)throw Error('Browser storage is unavailable. Restore using a browser with storage enabled.');localStorage.setItem(key,JSON.stringify(next));lastStored=JSON.stringify(next);state=next;page='dashboard';query='';render();toast('Backup restored.');});}catch(err){toast(err.message);}};input.click();}
function action(a,el){if(a.startsWith('new-')){edit(types[a.slice(4)]);return;}if(a==='edit'){edit(el.dataset.kind,el.dataset.id);return;}if(a==='toggle'){commit(next=>{const x=next.spaces[next.mode][el.dataset.kind].find(x=>x.id===el.dataset.id);x.done=!x.done;},'Updated completion status');return;}if(a==='freeze'){commit(next=>{const x=next.spaces[next.mode].cards.find(x=>x.id===el.dataset.id);x.frozen=!x.frozen;},'Changed demo card freeze');return;}if(a==='theme'){commit(next=>{next.settings.theme=el.dataset.value;});return;}if(a==='prev-month'||a==='next-month'){const d=new Date(year,month+(a==='prev-month'?-1:1));month=d.getMonth();year=d.getFullYear();render();return;}if(a==='today'){month=new Date().getMonth();year=new Date().getFullYear();render();return;}if(a==='appearance'){page='settings';render();return;}if(['summary','settings','notifications','tasks'].includes(a)){page=a;render();return;}if(a==='export'){exportData();return;}if(a==='import'){importData();return;}if(a==='clear'){dialog('Clear this workspace?',`<p class="muted" style="margin-top:20px">All items in ${esc(sp().name)} will be removed from this browser. Your other workspace is preserved.</p><label>Type CLEAR to confirm<input name="confirm" required pattern="CLEAR" autocomplete="off"></label>`,f=>{if(f.get('confirm')!=='CLEAR')throw Error('Type CLEAR to continue.');commit(next=>{for(const k of Object.values(types))next.spaces[next.mode][k]=[];next.spaces[next.mode].activity=[];},'Started a fresh workspace');});}}
app.addEventListener('click',ev=>{const mode=ev.target.closest('[data-mode]');if(mode){page='dashboard';query='';filter='All';commit(next=>{next.mode=mode.dataset.mode;});return;}const link=ev.target.closest('[data-page]');if(link){page=link.dataset.page;filter='All';render();return;}const f=ev.target.closest('[data-filter]');if(f){filter=f.dataset.filter;render();return;}const el=ev.target.closest('[data-action]');if(el){try{action(el.dataset.action,el);}catch(err){toast(err.message);}}});
app.addEventListener('submit',ev=>{ev.preventDefault();const f=new FormData(ev.target);if(ev.target.id==='search-form'){query=String(f.get('q')||'').trim();page='search';render();return;}if(ev.target.id==='details-form')commit(next=>{next.settings.name=f.get('name').trim();next.spaces[next.mode].name=f.get('workspace').trim();});if(ev.target.id==='appearance-form')commit(next=>{next.settings.accent=f.get('accent');next.settings.compact=f.has('compact');});if(ev.target.id==='widgets-form')commit(next=>{next.settings.widgets=f.getAll('widgets');next.settings.pins=f.getAll('pins');next.settings.reminders=f.has('reminders');});toast('Changes saved'+(storageOK?' to this browser.':' for this session only.'));});
window.addEventListener('storage',ev=>{if(ev.key===key)toast('Data changed in another tab. Reload before making further edits.');});
try{validateBackup(state);}catch{state=initial();storageOK=false;storageNotice='Saved data could not be read. Original storage is preserved; this session is temporary.';}
render();if(storageNotice)toast(storageNotice);
</script></body></html>
